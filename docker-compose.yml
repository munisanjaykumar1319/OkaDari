services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rideshare-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=Smart Bike Ride-Sharing & Cost-Sharing System
      - SECRET_KEY=supersecretjwtkeyforridesharingplatformchangeinproduction
      - SQLALCHEMY_DATABASE_URI=sqlite:///./data/bikerideshare.db
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost","http://127.0.0.1"]
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rideshare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
